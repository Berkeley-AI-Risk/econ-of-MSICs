name: Reproduce and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/msic-matplotlib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Model, app, and packaging tests
        run: python -m unittest discover -v
      - name: Independent raw-data reconciliation
        run: python sm_asic_topn/static/verify_outputs.py
      - name: Rebuild derived data in temporary space
        run: python scripts/check_reproduction.py
      - name: Generate the figure and results
        run: python scripts/reproduce.py
      - name: Check tracked inputs were not modified
        run: git diff --exit-code
